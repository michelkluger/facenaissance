name: Release

on:
  push:
    # Accept both `v1.2.3` and plain `1.2.3` tags.
    tags:
      - 'v*'
      - '[0-9]*'
  # Manual dispatch: pass a tag name (e.g. `0.1.0`) and the workflow will
  # check out that tag and upload its binaries to the matching release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build & attach binaries to (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: facenaissance-linux-x86_64
            bin: facenaissance
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: facenaissance-windows-x86_64
            bin: facenaissance.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: facenaissance-macos-aarch64
            bin: facenaissance
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: facenaissance-macos-x86_64
            bin: facenaissance

    steps:
      - uses: actions/checkout@v4
        with:
          # For manual dispatch, check out the given tag instead of the
          # branch the workflow file lives on. For tag pushes, `github.ref`
          # is already the tag, so this ref just re-selects it explicitly.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libwayland-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libv4l-dev libgtk-3-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp README.md LICENSE dist/
          cd dist
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a ../${{ matrix.artifact }}.zip .
          else
            tar czf ../${{ matrix.artifact }}.tar.gz *
          fi

      - uses: softprops/action-gh-release@v2
        with:
          # On manual dispatch, attach to the named tag's release.
          # On tag-push, softprops auto-detects the ref.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          fail_on_unmatched_files: false
